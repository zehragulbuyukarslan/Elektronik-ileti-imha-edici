<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elektronik İleti İmha Edici</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🗑️ Elektronik İleti İmha Edici</h1>
        
        <form id="deleteForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="email">📧 <strong>Email Adresi</strong></label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="ornek@icloud.com" 
                        required
                    >
                    <div class="info-text">iCloud email adresi</div>
                </div>

                <div class="form-group">
                    <label for="password">🔐 <strong></strong>Şifre</strong></label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Şifreniz" 
                        required
                    >
                    <div class="info-text">Şifreniz hiçbir yerde kaydedilmez</div>
                </div>

                <!-- Anahtar Kelimeler -->
                <div class="form-group">
                    <label for="keywords">🔑 <strong>Silinecek Anahtar Kelimeler</strong></label>
                    <textarea 
                        id="keywords" 
                        name="keywords" 
                        rows="3"
                        placeholder="Her bir kelimeyi Enter ile ayır&#10;Örnek:&#10;kariyer.net&#10;seminer"
                        required
                    ></textarea>
                    <div class="info-text">Her satıra bir kelime yazın</div>
                </div>

                <!-- Gönderici Filtresi (Opsiyonel) -->
                <div class="form-group">
                    <label for="deleteFrom">👤 <strong>Gönderici</strong> (Opsiyonel)</strong></label>
                    <input 
                        type="text" 
                        id="deleteFrom" 
                        name="delete_from" 
                        placeholder="Örn: sender@example.com"
                    >
                    <div class="info-text">Boş bırakırsan tüm gönderenlerden siler</div>
                </div>

                
                <div class="form-group">
                    <label for="startDate">📅 <strong>Başlangıç Tarihi</strong> (Opsiyonel)</label>
                    <input 
                        type="date" 
                        id="startDate" 
                        name="start_date"
                    >
                </div>

                <div class="form-group">
                    <label for="endDate">📅 <strong>Bitiş Tarihi</strong> (Opsiyonel)</label>
                    <input 
                        type="date" 
                        id="endDate" 
                        name="end_date"
                    >
                </div>
                
            </div>

            <button type="submit" id="deleteBtn">E-postaları Sil</button>

            <div id="status" class="status"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
